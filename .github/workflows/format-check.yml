name: format check

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-formatting:
    # if it's a PR, only run if not a draft
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # formatters come straight from cache.nixos.org; `nix fmt` fetches only what treefmt needs
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          determinate: false # don't log in to FlakeHub or install Determinate Nix
          diagnostic-endpoint: "" # don't send telemetry

      - name: Check code formatting
        run: nix fmt -- --ci
