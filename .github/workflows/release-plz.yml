name: release-plz

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # release unpublished packages
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases: ${{ steps.release-plz-step.outputs.releases }}
      releases_created: ${{ steps.release-plz-step.outputs.releases_created }}
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz-step
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142 (release-plz 0.3.172)
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # create a PR with the new versions and changelog, preparing the next release
  release-plz-pr:
    name: Release-plz PR
    needs: [release-plz-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142 (release-plz 0.3.172)
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # build and upload
  upload-assets:
    needs: [release-plz-release]
    permissions:
      contents: write
    if: ${{ contains(needs.release-plz-release.outputs.releases, '"package_name":"vantablock-app"') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: msi
          - os: macos-latest
            suffix: dmg
          - os: ubuntu-latest
            suffix: deb
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *install-rust

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libwayland-dev libxkbcommon-dev libgtk-3-dev

      - name: Install cargo-packager from GitHub
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build and Package Game
        run: |
          cargo build -p vantablock-app --bin vantablock --profile distribution --no-default-features --features client,distribution
          cargo packager -p vantablock-app --profile distribution

      - name: Build and Package Server
        shell: bash
        run: |
          cargo build -p vantablock-app --bin vantablock-server --no-default-features --features server --profile distribution

          # the dedicated server loads its assets from an assets folder next to the executable
          ARCH=$(uname -m)
          mkdir -p target/distribution/server/assets
          cp -r assets/shared assets/server target/distribution/server/assets/
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/distribution/vantablock-server.exe target/distribution/server/VantablockServer.exe
            cd target/distribution/server
            7z a "../VantablockServer-windows-${ARCH}.zip" VantablockServer.exe assets
          else
            cp target/distribution/vantablock-server target/distribution/server/VantablockServer
            cd target/distribution/server
            tar -czf "../VantablockServer-${{ matrix.os == 'macos-latest' && 'macos' || 'linux' }}-${ARCH}.tar.gz" VantablockServer assets
          fi

      - name: Extract Release Tag
        id: release_tag
        shell: bash
        run: |
          TAG=$(echo '${{ needs.release-plz-release.outputs.releases }}' | jq -r '.[] | select(.package_name == "vantablock-app") | .tag')
          if [ -z "$TAG" ] || [ "$TAG" == "null" ]; then
            echo "Error: Could not find tag for the app package."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Remove standalone binaries
        shell: bash
        run: |
          # only installers and server archives are released; the raw executables can't run
          # without their assets. Windows globs are case-insensitive, so these would otherwise
          # match the Vantablock*.exe installer pattern
          cd target/distribution/
          rm -f vantablock vantablock.exe vantablock-server vantablock-server.exe

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            target/distribution/Vantablock_*.dmg
            target/distribution/Vantablock_*.msi
            target/distribution/Vantablock_*-setup.exe
            target/distribution/Vantablock_*.deb
            target/distribution/Vantablock_*.AppImage
            target/distribution/VantablockServer*.tar.gz
            target/distribution/VantablockServer*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
