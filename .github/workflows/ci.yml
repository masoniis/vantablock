name: ci

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # debuginfo is unused in CI and bloats target/ enough to fill the runner disk
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint-and-test:
    # if it's a PR, only run if not a draft
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy

      # the azure apt mirror intermittently throttles to ~24 kB/s, so restore the packages from the
      # github cache instead of downloading them on every run
      - name: Install Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libasound2-dev libudev-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libwayland-dev libxkbcommon-dev
          version: 1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check benchmarks
        run: cargo check --benches

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --profile ci

      # nextest skips doctests; bevy/dynamic_linking makes their binaries load libstd and
      # bevy_dylib as shared libraries
      - name: Run doctests
        run: |
          export LD_LIBRARY_PATH="$(rustc --print target-libdir):$PWD/target/debug/deps:$LD_LIBRARY_PATH"
          cargo test --workspace --doc
