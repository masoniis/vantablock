[workspace]
members = [
  "crates/app",
  "crates/game/client",
  "crates/game/common",
  "crates/game/server",
  "crates/platform",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

# INFO: --------------------------
#         release profiles
# --------------------------------

# dev: fast compile with logs, slow runtime
[profile.dev]
opt-level = 0
debug = true

# dependencies compile once, and an unoptimized bevy is too slow to run
[profile.dev.package."*"]
opt-level = 3

# standard: fastish, but compiles quicker than distribution and keeps logging/debugging
# (no lto: it fails to link against the dynamically linked bevy)
[profile.release]
opt-level = 3
debug = 1
strip = false

# distribution: fast, super slow compile, limited logging and debugging
# used via `cargo build --profile distribution --features distribution`
[profile.distribution]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# INFO: ------------------------
#         workspace deps
# ------------------------------

[workspace.dependencies]
# other crates
# no default features, so their dynamic linking only applies when built directly
common = { path = "./crates/game/common", package = "vantablock-common", default-features = false }
server = { path = "./crates/game/server", package = "vantablock-server", default-features = false }
client = { path = "./crates/game/client", package = "vantablock-client", default-features = false }
platform = { path = "./crates/platform", package = "vantablock-platform" }

# development deps
criterion = { version = "0.8", features = ["html_reports"] }

# core logging/error handling deps
time = { version = "0.3.55", features = ["formatting", "macros"] }
tracing = { version = "0.1.41", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3.23", features = [
  "time",
  "local-time",
  "env-filter",
] }
tracy-client = "=0.18.5"
tracing-tracy = "=0.11.4"

# graphics deps
wesl = { version = "0.6.0", features = ["naga-ext"] }                                                               # shader compliation from WESL to WGSL
wesl-core = "0.1.0"  # include_wesl! for the compiled shaders
offset-allocator = "0.2.0"                                                   # gpu buffer allocation
bytemuck = { version = "1.25", features = ["derive"] }                       # gpu friendly data
image = { version = "0.25.6", default-features = false, features = ["png"] }

# game dependencies
bevy = { version = "0.19.1", default-features = false, features = [
  "bevy_state",
] }
leafwing-input-manager = "0.21.0"
lightyear = { version = "0.30.1", default-features = false, features = [
  "replication", # allows replicating components between server and client
  "leafwing",    # leafwing input support with built-in rollback
  "crossbeam",   # enables crossbeam as an IO layer (for client as the host on same machine)
  "netcode",     # needed to manage distinct conns
  "udp",         # needed for dedicated/lan
] }

# development tooling
bevy_brp_extras = "0.22.10" # remote protocol (BRP) methods for agent-driven testing, pinned to bevy 0.19

# general utilities
futures-lite = "2.6.1" # future utils
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
serde = { version = "1.0.228", features = ["derive"] } # serializing
rand = "0.10.3" # rng
ron = "0.12.2" # parsing RON files
zstd = "0.14"
noise = { version = "0.9.0", default-features = false } # gen random noise
crossbeam = "0.8.4" # thread comms
glob = "0.3.3" # reading dirs
directories = "6.0" # platform-specific dirs
sysinfo = { version = "0.39.6", default-features = false, features = [
  "system",
] }
