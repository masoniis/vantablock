[workspace]
# crates are grouped by layer; dependencies only flow downward:
#   platform, engine/{voxel <- baker} <- game/common <- game/{server, client} <- app
members = [
  "crates/app",
  "crates/engine/baker",
  "crates/engine/voxel",
  "crates/game/client",
  "crates/game/common",
  "crates/game/server",
  "crates/platform",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

# INFO: --------------------------
#         release profiles
# --------------------------------

# dev: fast compile with logs, slow runtime
[profile.dev]
opt-level = 0
debug = true

# standard: fastish, but compiles quicker than distribution and keeps logging/debugging
[profile.release]
opt-level = 3
lto = "thin"
debug = 1
strip = false

# the voxel core and content baker are hot paths (asset baking, CPU reference traversal), so
# they are optimized even in dev builds to keep startup bakes and tests fast
[profile.dev.package.vantablock-voxel]
opt-level = 3

[profile.dev.package.vantablock-baker]
opt-level = 3

# the generators and reference traversal do all their math through glam, which is otherwise
# unoptimized in dev builds and makes a first-launch bake take a minute instead of seconds
[profile.dev.package.glam]
opt-level = 3

# distribution: fast, super slow compile, limited logging and debugging
# used via `cargo build --profile distribution --features distribution`
[profile.distribution]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# INFO: ------------------------
#         workspace deps
# ------------------------------

[workspace.dependencies]
# other crates
platform = { path = "./crates/platform", package = "vantablock-platform" }
voxel = { path = "./crates/engine/voxel", package = "vantablock-voxel" }
baker = { path = "./crates/engine/baker", package = "vantablock-baker" }
common = { path = "./crates/game/common", package = "vantablock-common" }
server = { path = "./crates/game/server", package = "vantablock-server" }
client = { path = "./crates/game/client", package = "vantablock-client" }

# development deps
criterion = { version = "0.5", features = ["html_reports"] }

# core logging/error handling deps
time = { version = "0.3.43", features = ["formatting", "macros"] }
tracing = { version = "0.1.41", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3.20", features = [
  "time",
  "local-time",
  "env-filter",
] }
tracy-client = "=0.18.0"
tracing-tracy = "=0.11.4"

# graphics deps
wesl = "0.2.0"                                         # shader compliation from WESL to WGSL
bytemuck = { version = "1.13", features = ["derive"] } # gpu friendly data
glam = { version = "0.30", features = ["bytemuck"] }   # math for the bevy-free voxel core, matches bevy's glam

# game dependencies
bevy = { version = "0.18.1", default-features = false, features = [
  "bevy_state",
] }
leafwing-input-manager = "0.20.0"
lightyear = { version = "0.26.4", default-features = false, features = [
  "replication", # allows replicating components between server and client
  "leafwing",    # leafwing input support with built-in rollback
  "crossbeam",   # enables crossbeam as an IO layer (for client as the host on same machine)
  "netcode",     # needed to manage distinct conns
  "udp",         # needed for dedicated/lan
] }

# development tooling
bevy_brp_extras = "0.19.0" # remote protocol (BRP) methods for agent-driven testing, pinned to bevy 0.18

# general utilities
futures-lite = "2.6.1" # future utils
derive_more = { version = "2.0.1", features = ["deref", "deref_mut"] }
serde = { version = "1.0.228", features = ["derive"] } # serializing
rand = "0.9.2" # rng
ron = "0.11.0" # parsing RON files
zstd = "0.13" # compression for .vanta assets
directories = "6.0" # platform-specific dirs
sysinfo = { version = "0.37.2", default-features = false, features = [
  "system",
] }
