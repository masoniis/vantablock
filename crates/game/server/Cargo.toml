[package]
name = "vantablock-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "server"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
platform = { workspace = true }
common = { workspace = true }

# INFO: --------------------------------
#         logging/error handling
# --------------------------------------

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# INFO: --------------------------
#         simulation logic
# --------------------------------

bevy = { workspace = true, features = [
  "bevy_asset", # asset management
  "bevy_state", # state machines
] }
leafwing-input-manager = { workspace = true }
lightyear = { workspace = true, features = [
  # extends default lightyear features in workspace
  "server", # server plugins
] }

# INFO: ---------------
#         utils
# ---------------------

serde = { workspace = true } # serializing
ron = { workspace = true }   # parsing RON files
rand = { workspace = true }  # scene scattering
