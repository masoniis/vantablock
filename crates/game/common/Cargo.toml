[package]
name = "vantablock-common"
description = "the game logic and protocol both vantablock peers run"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "common"
path = "src/lib.rs"

[features]
default = ["bevy/dynamic_linking"]

[dependencies]
platform = { workspace = true }
voxel = { workspace = true }
baker = { workspace = true }

# INFO: --------------------------------
#         logging/error handling
# --------------------------------------

tracing = { workspace = true }

# INFO: --------------------------
#         simulation logic
# --------------------------------

bevy = { workspace = true }
leafwing-input-manager = { workspace = true }
lightyear = { workspace = true, features = [
  # common needs these for protocol definitions
  "interpolation", # smoothing intended for more pleasing visuals
  "prediction",    # for local predictions agaisnt server to get snappy feedback
] }

# INFO: ---------------
#         utils
# ---------------------

serde = { workspace = true } # serializing
derive_more = { workspace = true }
ron = { workspace = true }   # parsing RON files
